version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # 7-day cooldown mirrors the exclude-newer quarantine in pyproject.toml:
    # Dependabot waits at least 7 days before raising a PR for a new version,
    # giving the community time to detect and yank malicious releases.
    cooldown:
      default-days: 7
    # Hold langfuse at 2.x until a deliberate v3/v4 (OpenTelemetry rewrite)
    # migration is validated. The LiteLLM↔Langfuse callback integration in
    # src/langres/clients/llm.py is a side-effect not covered by unit tests
    # and must be validated end-to-end before taking the major bump (#25).
    ignore:
      - dependency-name: "langfuse"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # `github/codeql-action/init` and `.../analyze` are separate "dependencies"
      # to Dependabot but ONE product: init writes a config file stamped with its
      # own version and analyze refuses to read a config from a different one.
      # Bumping half the pair therefore always fails the job outright:
      #   ##[error]Loaded a configuration file for version '4.37.3',
      #            but running version '4.37.0'
      # That is exactly what killed PR #231 (init 4.37.0->4.37.3) and #233
      # (analyze 4.37.0->4.37.3) -- two red PRs for one un-splittable bump.
      # Grouping them means one PR moves every codeql-action step together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
