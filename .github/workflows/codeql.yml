name: CodeQL

# Static security analysis (free for public repos). Python-only; findings land
# in the repo's Security tab -> Code scanning.
# NOTE: `pull_request.branches` filters by TARGET branch, so this list has to
# track the one in `lint.yml`/`test.yml` -- a PR into a branch missing here gets
# NO security scan at all, silently. Both integration branches below still exist
# on the remote, so the drift was a live gap, not a stale entry.
on:
  push:
    branches: [main, epic/193-core-algebra]
  pull_request:
    branches: [main, feat/core-packages, epic/193-core-algebra]
  schedule:
    # Weekly on Monday at 07:00 UTC (between the test-full and security crons)
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # to upload SARIF results
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: python
          # security-extended adds lower-severity/precision queries on top of
          # the default suite. `Analyze (python)` IS a required check on PRs
          # into main (branch protection) -- it runs on every such PR, so it
          # can be required without deadlocking. Findings themselves land in
          # Security -> Code scanning and do not fail the job; what this gate
          # catches is the job failing outright, e.g. the codeql-action version
          # mismatch that this pin exists to prevent.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/language:python"
