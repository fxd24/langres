name: OpenSSF Scorecard

# Supply-chain security posture scoring (free for public repos). Results feed
# the Security tab (code scanning) and, with publish_results, the public
# OpenSSF REST API that backs the README badge:
#   https://securityscorecards.dev/viewer/?uri=github.com/fxd24/langres
on:
  branch_protection_rule:
  schedule:
    # Weekly on Tuesday at 07:00 UTC
    - cron: "0 7 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # to upload SARIF results
      id-token: write # to publish results (publish_results: true)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the OpenSSF API so the README badge and the public
          # viewer work. Publishing needs no secret on public repos (OIDC).
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
